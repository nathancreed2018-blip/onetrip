<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>OneTrip</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      body { margin: 0; background: #faf7f1; }
      #planner-loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; color: #573563; background: #faf7f1; font: 16px/1.5 system-ui, sans-serif; }
      #planner-loading[hidden] { display: none; }
      #planner-loading strong { color: #26221f; font: 32px Georgia, serif; }
      .loading-ring { width: 28px; height: 28px; margin: 0 auto; border: 3px solid #e1d7e4; border-top-color: #754486; border-radius: 50%; animation: loading-spin 1s linear infinite; }
      @keyframes loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loading-ring { animation: none; } }
    </style>
  <link rel="icon" href="/planner/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="planner-loading" role="status" aria-live="polite">
      <strong>OneTrip</strong>
      <span class="loading-ring" aria-hidden="true"></span>
      <span>Opening your trip planner…</span>
    </div>
    <noscript><style>#planner-loading { display: none; }</style></noscript>
    <script>
      (() => {
        const root = document.getElementById('root');
        const loading = document.getElementById('planner-loading');
        const observer = new MutationObserver(() => {
          if (root.firstElementChild) {
            loading.hidden = true;
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
  <script src="/planner/_expo/static/js/web/index-53650d1ea7513b23074ac618944213ca.js" defer></script>
</body>
</html>
